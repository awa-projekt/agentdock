site_name: AgentDock
repo_url: https://github.com/awa-projekt/agentdock
repo_name: awa-projekt/agentdock
site_description: Architecture and operator documentation for AgentDock.
dev_addr: 127.0.0.1:13400
docs_dir: docs
site_dir: public

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Features: features.md
  - API Surface: api.md
  - A2A Events: a2a-events.md
  - Workflows: workflows.md
  - Multi-agent Patterns: patterns.md
  - Data Model: data-model.md
  - Operations: operations.md
  - Development: development.md
