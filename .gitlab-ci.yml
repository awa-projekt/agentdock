workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

image: python:3.12-slim

stages:
  - check
  - deploy

.bun:
  stage: check
  image: node:24-bookworm-slim
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends git
    - npm install --global bun@1.3.14
    - bun install --frozen-lockfile

typecheck:
  extends: .bun
  script:
    - bun run typecheck

lint:
  extends: .bun
  script:
    - bun run format:check
    - bun run lint
    - bun run knip

test:
  extends: .bun
  script:
    - bun run test

pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --no-cache-dir "mkdocs<2" mkdocs-material pymdown-extensions
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 1 week
